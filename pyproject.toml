[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firelab"
version = "0.1.0"
description = "Fire Lab: an Omnigent agentic lab for wildfire fuel-treatment placement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.5",
    "requests>=2.31",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.10"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7"]
all = ["mlflow>=2.10", "matplotlib>=3.7", "pytest>=7"]

[project.scripts]
firelab = "firelab.cli:main"

[tool.setuptools.packages.find]
include = ["firelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
